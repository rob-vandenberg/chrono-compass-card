name: Build

on:
  push:
    branches:
      - main
    paths:
      - 'src/chrono-compass-card.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=$(grep -o "CARD_VERSION = '[^']*'" src/chrono-compass-card.js | sed "s/CARD_VERSION = '//;s/'//")" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build

      - name: Copy image folders into dist
        run: |
          mkdir -p dist
          cp -r planets dist/
          cp -r clocks dist/

      - name: Commit built files
        uses: EndBug/add-and-commit@v9
        with:
          add: '["chrono-compass-card.js", "dist/"]'
          message: "Auto-build minified JS from source v${{ steps.version.outputs.version }}"
